<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEOSTORM ELITE</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="gatekeeper">
        <div class="gate-card">
            <h1 style="font-family: var(--head); color: var(--ind3); margin-bottom: 10px;">GEOSTORM ELITE</h1>
            <input type="password" id="passInput" class="gate-input" style="width:100%; background:black; border:1px solid var(--bdr3); color:white; padding:10px; margin:20px 0;" placeholder="CONTRASEÑA">
            <button onclick="checkAccess()" style="width:100%; background:var(--ind); border:none; color:white; padding:10px; cursor:pointer; font-weight:bold;">ENTRAR</button>
            <p id="errorMsg" style="color:var(--red); display:none; margin-top:10px; font-size:12px;">CLAVE INCORRECTA</p>
        </div>
    </div>

    <div class="app-shell">
        <header class="top-bar">
            <div style="padding: 0 20px; font-family: var(--head); font-weight: bold; color: var(--ind3); font-size: 20px;">
                GEOSTORM <span style="color:var(--mu); font-weight: 300;">ELITE</span>
            </div>
        </header>

        <div class="main-wrapper">
            <nav class="side-nav" style="width: 240px; border-right: 1px solid var(--bdr); padding: 20px; display: flex; flex-direction: column; gap: 8px;">
                <button class="asset-btn active" onclick="setAsset('BTCUSDT', 'BITCOIN / DOLLAR', this)">BITCOIN</button>
                <button class="asset-btn" onclick="setAsset('GOLD', 'GOLD / ORE', this)">GOLD</button>
                <button class="asset-btn" onclick="setAsset('NASDAQ', 'NASDAQ 100', this)">NASDAQ</button>
            </nav>

            <main style="flex-grow: 1; display: grid; grid-template-columns: 1fr 350px; padding: 20px; gap: 20px; background: var(--bg0);">
                
                <section style="background: var(--bg1); border: 1px solid var(--bdr); border-radius: 4px; display: flex; flex-direction: column;">
                    <div style="padding: 15px; border-bottom: 1px solid var(--bdr); font-family: var(--head); font-weight: bold;" id="tv-asset-title">TERMINAL READY</div>
                    <div id="tv-chart-container" style="flex-grow: 1;">
                        </div>
                </section>

                <aside style="background: var(--bg1); border: 1px solid var(--bdr); border-radius: 4px; display: flex; flex-direction: column; overflow: hidden;">
                    <div style="padding: 10px; border-bottom: 1px solid var(--bdr); display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-family: var(--head); font-size: 14px; font-weight: bold;">INTEL FEED</span>
                        <span class="live-led">● LIVE</span>
                    </div>
                    <iframe src="https://cryptopanic.com/widgets/news/?bg_color=06060f&font_family=sans&header_bg_color=06060f&header_text_color=6366f1&link_color=dde4ff&news_feed=all&posts_limit=10&text_color=8892bb" width="100%" height="100%" frameborder="0"></iframe>
                </aside>
            </main>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
